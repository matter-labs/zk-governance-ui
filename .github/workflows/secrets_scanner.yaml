name: Leaked Secrets Scan
on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  TruffleHog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # No base/head inputs (unlike the org's file): a pull request's checkout has no local `main`, so
      # `base: main` fails to resolve and TruffleHog scans nothing ("no base refs succeeded") yet passes.
      # Without them the action scans the pull request's commits, from its base SHA to its head SHA.
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@a94d152bf65bebf5baa486d3d4dfee520af2ceed # v3.88.2
        with:
          path: ./
          extra_args: --debug --only-verified
